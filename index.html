<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Math Flow</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Math Flow">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#163b68">

  <style>
    :root {
      --navy: #163b68;
      --blue: #3979bd;
      --green: #4e9562;
      --purple: #8458a5;
      --orange: #db8437;
      --teal: #338b8b;
      --pink: #c75e86;
      --red: #cb5050;

      --bg: #f3f6fa;
      --card: #ffffff;
      --text: #202733;
      --muted: #6c7888;
      --line: #dce2ea;
      --soft: #edf3f9;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--navy);
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;

      display: flex;
      align-items: center;
      gap: 8px;

      min-height: 58px;
      padding:
        calc(9px + env(safe-area-inset-top))
        12px
        9px;

      color: white;
      background: rgba(22, 59, 104, 0.97);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.17);
      backdrop-filter: blur(16px);
    }

    .brand {
      flex: 1;
      min-width: 0;
    }

    .brand strong {
      display: block;
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    .brand small {
      display: block;
      margin-top: 2px;
      color: #d7e5f5;
      font-size: 11px;
    }

    .header-button {
      height: 38px;
      padding: 0 11px;
      border: 0;
      border-radius: 10px;
      color: var(--navy);
      background: white;
      font-size: 12px;
      font-weight: 900;
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding:
        11px
        10px
        calc(28px + env(safe-area-inset-bottom));
    }

    .summary {
      margin-bottom: 11px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      box-shadow: 0 4px 17px rgba(31, 50, 76, 0.07);
    }

    .summary-title {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary-title h1 {
      margin: 0;
      color: var(--navy);
      font-size: 26px;
      letter-spacing: -1px;
    }

    .summary-title span {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .progress-box {
      min-width: 0;
      padding: 9px 5px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fafbfd;
      text-align: center;
    }

    .progress-box strong {
      display: block;
      overflow: hidden;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-number {
      display: block;
      margin: 4px 0 6px;
      font-size: 14px;
      font-weight: 900;
    }

    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e9ef;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
    }

    .domain {
      --domain-color: var(--blue);
      --domain-light: #f0f6fc;

      overflow: hidden;
      margin-bottom: 11px;
      border: 1.5px solid var(--domain-color);
      border-radius: 16px;
      background: white;
      box-shadow: 0 4px 16px rgba(31, 50, 76, 0.06);
    }

    .domain-header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 51px;
      padding: 10px 12px;
      background:
        linear-gradient(90deg, var(--domain-light), white);
    }

    .domain-number {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      color: white;
      background: var(--domain-color);
      font-size: 12px;
      font-weight: 900;
    }

    .domain-name {
      flex: 1;
      min-width: 0;
      color: var(--navy);
      font-size: 17px;
      font-weight: 900;
    }

    .domain-rate {
      color: var(--domain-color);
      font-size: 13px;
      font-weight: 900;
    }

    .chapter {
      border-top: 1px solid var(--line);
    }

    .chapter-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 56px;
      padding: 10px 11px;
      border: 0;
      color: var(--text);
      background: white;
      text-align: left;
    }

    .chapter-toggle:active {
      background: #f7f9fc;
    }

    .grade-badge {
      flex: 0 0 auto;
      min-width: 44px;
      padding: 5px 6px;
      border-radius: 8px;
      color: white;
      background: var(--domain-color);
      font-size: 11px;
      font-weight: 900;
      text-align: center;
    }

    .chapter-info {
      flex: 1;
      min-width: 0;
    }

    .chapter-name {
      display: block;
      font-size: 14px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .chapter-rate {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
    }

    .chapter-arrow {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 18px;
      transition: transform 0.2s ease;
    }

    .chapter.open .chapter-arrow {
      transform: rotate(90deg);
    }

    .concept-list {
      display: none;
      padding: 0 9px 10px;
      background: #fbfcfd;
    }

    .chapter.open .concept-list {
      display: block;
    }

    .concept {
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }

    .concept-header {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      padding: 8px 9px;
      border-bottom: 1px solid var(--line);
      background: #f7f9fc;
    }

    .concept-index {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      color: white;
      background: var(--domain-color);
      font-size: 10px;
      font-weight: 900;
    }

    .concept-name {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .concept-rate {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .edit-concept {
      min-width: 38px;
      height: 30px;
      border: 1px solid #d2dae4;
      border-radius: 8px;
      color: #5b6878;
      background: white;
      font-size: 10px;
      font-weight: 900;
    }

    .book-row {
      display: grid;
      grid-template-columns: minmax(64px, 0.8fr) minmax(110px, 1.2fr) 60px;
      gap: 7px;
      align-items: center;
      min-height: 48px;
      padding: 7px 9px;
      border-bottom: 1px solid var(--line);
    }

    .book-row:last-child {
      border-bottom: 0;
    }

    .book-name {
      min-width: 0;
      font-size: 11px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .page-inputs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 4px;
      align-items: center;
    }

    .page-inputs input {
      width: 100%;
      min-width: 0;
      height: 32px;
      padding: 4px;
      border: 1px solid #cbd4df;
      border-radius: 7px;
      background: white;
      text-align: center;
      font-size: 12px;
    }

    .page-inputs span {
      color: var(--muted);
      font-size: 10px;
    }

    .date-button {
      min-width: 58px;
      height: 32px;
      padding: 0 4px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      color: var(--muted);
      background: white;
      font-size: 9px;
      font-weight: 900;
      white-space: nowrap;
    }

    .date-button.completed {
      color: white;
      border-color: var(--green);
      background: var(--green);
    }

    .add-concept {
      width: 100%;
      min-height: 40px;
      margin-top: 8px;
      border: 1px dashed var(--domain-color);
      border-radius: 10px;
      color: var(--domain-color);
      background: var(--domain-light);
      font-size: 11px;
      font-weight: 900;
    }

    .tip {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--muted);
      background: white;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (min-width: 780px) {
      .domain-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
        align-items: start;
      }

      .domain {
        margin-bottom: 0;
      }
    }

    @page {
      size: A4 landscape;
      margin: 7mm;
    }

    @media print {
      body {
        background: white;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .app-header,
      .summary,
      .tip,
      .edit-concept,
      .add-concept {
        display: none !important;
      }

      main {
        width: 100%;
        padding: 0;
      }

      .domain-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2.5mm;
        align-items: start;
      }

      .domain {
        margin: 0;
        border-radius: 2mm;
        box-shadow: none;
        break-inside: avoid;
      }

      .domain-header {
        min-height: 9mm;
        padding: 1.5mm 2mm;
      }

      .domain-number {
        width: 5mm;
        height: 5mm;
        font-size: 6pt;
      }

      .domain-name {
        font-size: 9pt;
      }

      .domain-rate {
        font-size: 7pt;
      }

      .chapter-toggle {
        min-height: 8mm;
        padding: 1.2mm 1.5mm;
      }

      .grade-badge {
        min-width: 10mm;
        padding: 1mm;
        font-size: 6pt;
      }

      .chapter-name {
        font-size: 7pt;
      }

      .chapter-rate,
      .chapter-arrow {
        display: none;
      }

      .concept-list {
        display: block !important;
        padding: 0 1.3mm 1.3mm;
      }

      .concept {
        margin-top: 1.3mm;
        border-radius: 1.3mm;
      }

      .concept-header {
        min-height: 6mm;
        padding: 1mm 1.3mm;
      }

      .concept-index {
        width: 4mm;
        height: 4mm;
        font-size: 5pt;
      }

      .concept-name {
        font-size: 6.5pt;
      }

      .concept-rate {
        font-size: 5.5pt;
      }

      .book-row {
        grid-template-columns: 15mm 1fr 14mm;
        min-height: 6mm;
        padding: 0.8mm 1.2mm;
      }

      .book-name {
        font-size: 5.5pt;
      }

      .page-inputs input {
        height: 5mm;
        border: 0;
        padding: 0;
        font-size: 5.5pt;
      }

      .page-inputs span {
        font-size: 5pt;
      }

      .date-button {
        min-width: 13mm;
        height: 5mm;
        border: 0;
        padding: 0;
        color: #333;
        background: transparent;
        font-size: 5pt;
      }

      .date-button.completed {
        color: #111;
        background: transparent;
      }
    }
  </style>
</head>

<body>

<header class="app-header">
  <div class="brand">
    <strong>Math Flow</strong>
    <small id="saveStatus">자동 저장</small>

  <button

  <section id="domainGrid" class="domain-grid"></section>

    공부를 마치면 오른쪽의 <b>완료</b>를 누르세요.
    완료 칸에는 체크 대신 날짜가 기록됩니다.
  </div>
</main>

    domain(

  function domain(id, number, name, color, light, chapters) {
    return {
      id,
      number,
      name,
      color,
      light,
      chapters
    };
  }

  function chapter(grade, title, conceptNames) {
    return {
      id: makeId(),
      grade,
      title,
      open: false,
      concepts: conceptNames.map(name => concept(name))
    };
  }

  function concept(name) {
    const progress = {};

    BOOKS.forEach(book => {
      progress[book.id] = {
        startPage: "",
        endPage: "",
        completedDate: ""
      };
    });

    return {
      id: makeId(),
      name,
      progress
    };
  }

  function makeId() {
    return (
      Date.now().toString(36) +
      Math.random().toString(36).slice(2, 8)
    );
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  let domains = loadDomains();

  function loadDomains() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : clone(DEFAULT_DOMAINS);
    } catch {
      return clone(DEFAULT_DOMAINS);
    }
  }

  function saveDomains() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(domains));

    const status = document.getElementById("saveStatus");
    status.textContent = "방금 저장됨";

    clearTimeout(window.saveTimer);

    window.saveTimer = setTimeout(() => {
      status.textContent = "자동 저장";
    }, 1300);
  }

  function render() {
    renderSummary();
    renderDomains();
  }

  function renderSummary() {
    const grid = document.getElementById("progressGrid");

    grid.innerHTML = BOOKS.map(book => {
      const stats = getBookStats(book.id);

      return `
        <div class="progress-box">
          <strong style="color:${book.color}">
            ${escapeHtml(book.shortName)}
          </strong>

          <span class="progress-number">
            ${stats.done} / ${stats.total}
          </span>

          <div class="progress-track">
            <div
              class="progress-fill"
              style="
                width:${stats.percent}%;
                background:${book.color};
              ">
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderDomains() {
    const grid = document.getElementById("domainGrid");

    grid.innerHTML = domains.map(domainItem => {
      const domainStats = getDomainStats(domainItem);

      const chapters = domainItem.chapters.map(chapterItem => {
        const chapterStats = getChapterStats(chapterItem);

        return `
          <article
            class="chapter ${chapterItem.open ? "open" : ""}">

            <button
              class="chapter-toggle"
              type="button"
              onclick="toggleChapter(
                '${domainItem.id}',
                '${chapterItem.id}'
              )">

              <span class="grade-badge">
                ${escapeHtml(chapterItem.grade)}
              </span>

              <span class="chapter-info">
                <span class="chapter-name">
                  ${escapeHtml(chapterItem.title)}
                </span>

                <span class="chapter-rate">
                  ${chapterStats.done} / ${chapterStats.total}
                  · ${chapterStats.percent}%
                </span>
              </span>

              <span class="chapter-arrow">›</span>
            </button>

            <div class="concept-list">
              ${chapterItem.concepts.map(
                (conceptItem, conceptIndex) =>
                  renderConcept(
                    domainItem,
                    chapterItem,
                    conceptItem,
                    conceptIndex
                  )
              ).join("")}

              <button
                class="add-concept"
                type="button"
                onclick="addConcept(
                  '${domainItem.id}',
                  '${chapterItem.id}'
                )">
                ＋ 소단원 추가
              </button>
            </div>
          </article>
        `;
      }).join("");

      return `
        <section
          class="domain"
          style="
            --domain-color:${domainItem.color};
            --domain-light:${domainItem.light};
          ">

          <header class="domain-header">
            <span class="domain-number">
              ${domainItem.number}
            </span>

            <span class="domain-name">
              ${escapeHtml(domainItem.name)}
            </span>

            <span class="domain-rate">
              ${domainStats.percent}%
            </span>
          </header>

          ${chapters}
        </section>
      `;
    }).join("");
  }

  function renderConcept(
    domainItem,
    chapterItem,
    conceptItem,
    conceptIndex
  ) {
    const conceptStats = getConceptStats(conceptItem);

    const bookRows = BOOKS.map(book => {
      const value = conceptItem.progress[book.id];

      return `
        <div class="book-row">
          <div
            class="book-name"
            style="color:${book.color}">
            ${escapeHtml(book.shortName)}
          </div>

          <div class="page-inputs">
            <input
              type="number"
              min="1"
              inputmode="numeric"
              value="${escapeAttribute(value.startPage)}"
              placeholder="시작"
              onchange="updatePage(
                '${domainItem.id}',
                '${chapterItem.id}',
                '${conceptItem.id}',
                '${book.id}',
                'startPage',
                this.value
              )">

            <span>~</span>

            <input
              type="number"
              min="1"
              inputmode="numeric"
              value="${escapeAttribute(value.endPage)}"
              placeholder="끝"
              onchange="updatePage(
                '${domainItem.id}',
                '${chapterItem.id}',
                '${conceptItem.id}',
                '${book.id}',
                'endPage',
                this.value
              )">
          </div>

          <button
            class="date-button
              ${value.completedDate ? "completed" : ""}"
            type="button"
            onclick="toggleCompletedDate(
              '${domainItem.id}',
              '${chapterItem.id}',
              '${conceptItem.id}',
              '${book.id}'
            )">

            ${value.completedDate
              ? escapeHtml(shortDate(value.completedDate))
              : "완료"}
          </button>
        </div>
      `;
    }).join("");

    return `
      <section class="concept">
        <header class="concept-header">
          <span class="concept-index">
            ${conceptIndex + 1}
          </span>

          <span class="concept-name">
            ${escapeHtml(conceptItem.name)}
          </span>

          <span class="concept-rate">
            ${conceptStats.percent}%
          </span>

          <button
            class="edit-concept"
            type="button"
            onclick="editConcept(
              '${domainItem.id}',
              '${chapterItem.id}',
              '${conceptItem.id}'
            )">
            수정
          </button>
        </header>

        ${bookRows}
      </section>
    `;
  }

  function toggleChapter(domainId, chapterId) {
    const chapterItem = findChapter(domainId, chapterId);

    if (!chapterItem) {
      return;
    }

    chapterItem.open = !chapterItem.open;
    saveDomains();
    renderDomains();
  }

  function updatePage(
    domainId,
    chapterId,
    conceptId,
    bookId,
    field,
    value
  ) {
    const conceptItem = findConcept(
      domainId,
      chapterId,
      conceptId
    );

    if (!conceptItem || !conceptItem.progress[bookId]) {
      return;
    }

    conceptItem.progress[bookId][field] =
      value ? String(value) : "";

    saveDomains();
  }

  function toggleCompletedDate(
    domainId,
    chapterId,
    conceptId,
    bookId
  ) {
    const conceptItem = findConcept(
      domainId,
      chapterId,
      conceptId
    );

    if (!conceptItem || !conceptItem.progress[bookId]) {
      return;
    }

    const record = conceptItem.progress[bookId];

    if (record.completedDate) {
      const remove = confirm(
        `${shortDate(record.completedDate)} 완료 기록을 지울까요?`
      );

      if (!remove) {
        return;
      }

      record.completedDate = "";
    } else {
      record.completedDate = todayIso();
    }

    saveDomains();
    render();
  }

  function editConcept(domainId, chapterId, conceptId) {
    const chapterItem = findChapter(domainId, chapterId);
    const conceptItem = findConcept(
      domainId,
      chapterId,
      conceptId
    );

    if (!chapterItem || !conceptItem) {
      return;
    }

    const newName = prompt(
      "소단원 이름을 수정하세요.",
      conceptItem.name
    );

    if (newName === null) {
      return;
    }

    const trimmed = newName.trim();

    if (!trimmed) {
      const remove = confirm(
        "이름이 비어 있습니다. 소단원을 삭제할까요?"
      );

      if (remove) {
        chapterItem.concepts =
          chapterItem.concepts.filter(
            item => item.id !== conceptId
          );
      }
    } else {
      conceptItem.name = trimmed;
    }

    saveDomains();
    render();
  }

  function addConcept(domainId, chapterId) {
    const chapterItem = findChapter(domainId, chapterId);

    if (!chapterItem) {
      return;
    }

    const name = prompt("추가할 소단원 이름을 입력하세요.");

    if (name === null || !name.trim()) {
      return;
    }

    chapterItem.concepts.push(concept(name.trim()));

    saveDomains();
    render();
  }

  function findDomain(domainId) {
    return domains.find(item => item.id === domainId);
  }

  function findChapter(domainId, chapterId) {
    const domainItem = findDomain(domainId);

    return domainItem?.chapters.find(
      item => item.id === chapterId
    );
  }

  function findConcept(domainId, chapterId, conceptId) {
    const chapterItem = findChapter(domainId, chapterId);

    return chapterItem?.concepts.find(
      item => item.id === conceptId
    );
  }

  function getConceptStats(conceptItem) {
    const records = BOOKS.map(
      book => conceptItem.progress[book.id]
    );

    const done = records.filter(
      item => Boolean(item.completedDate)
    ).length;

    return {
      done,
      total: records.length,
      percent: Math.round((done / records.length) * 100)
    };
  }

  function getChapterStats(chapterItem) {
    let done = 0;
    let total = 0;

    chapterItem.concepts.forEach(conceptItem => {
      const stats = getConceptStats(conceptItem);
      done += stats.done;
      total += stats.total;
    });

    return {
      done,
      total,
      percent: total === 0
        ? 0
        : Math.round((done / total) * 100)
    };
  }

  function getDomainStats(domainItem) {
    let done = 0;
    let total = 0;

    domainItem.chapters.forEach(chapterItem => {
      const stats = getChapterStats(chapterItem);
      done += stats.done;
      total += stats.total;
    });

    return {
      done,
      total,
      percent: total === 0
        ? 0
        : Math.round((done / total) * 100)
    };
  }

  function getBookStats(bookId) {
    let done = 0;
    let total = 0;

    domains.forEach(domainItem => {
      domainItem.chapters.forEach(chapterItem => {
        chapterItem.concepts.forEach(conceptItem => {
          total++;

          if (
            conceptItem.progress[bookId]?.completedDate
          ) {
            done++;
          }
        });
      });
    });

    return {
      done,
      total,
      percent: total === 0
        ? 0
        : Math.round((done / total) * 100)
    };
  }

  function todayIso() {
    const date = new Date();
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }

  function shortDate(value) {
    const parts = String(value).split("-");

    if (parts.length !== 3) {
      return value;
    }

    return `${Number(parts[1])}/${Number(parts[2])}`;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttribute(value) {
    return escapeHtml(value ?? "");
  }

  render();
</script>
